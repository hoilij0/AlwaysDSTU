<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="title description">
  <title id="title">Структура базы данных Always DSTU</title>
  <desc id="description">ER-схема пяти таблиц PostgreSQL: groups, schedule_snapshots, lessons, notes и sync_log, с первичными и внешними ключами.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3478d4"/>
    </marker>
    <style>
      .bg { fill: #f4f7fc; }
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #172b4d; }
      .subtitle { font: 16px 'Segoe UI', Arial, sans-serif; fill: #60728f; }
      .card { fill: #ffffff; stroke: #d5e0f0; stroke-width: 2; }
      .card-head { fill: #17365f; }
      .table-name { font: 700 22px Consolas, 'Courier New', monospace; fill: #ffffff; }
      .table-desc { font: 14px 'Segoe UI', Arial, sans-serif; fill: #d7e4f7; }
      .field { font: 16px Consolas, 'Courier New', monospace; fill: #263b5b; }
      .key { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .key-pk { fill: #3478d4; }
      .key-fk { fill: #2b9472; }
      .line { fill: none; stroke: #3478d4; stroke-width: 3; marker-end: url(#arrow); }
      .line-optional { fill: none; stroke: #7a91b2; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .relation { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #315d96; }
      .count { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #315d96; }
      .note { font: 15px 'Segoe UI', Arial, sans-serif; fill: #425876; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="1240" rx="24"/>
  <text class="title" x="750" y="53" text-anchor="middle">Структура базы данных Always DSTU</text>
  <text class="subtitle" x="750" y="82" text-anchor="middle">PostgreSQL · предварительная схема из Always DSTU.sql</text>

  <!-- groups -->
  <g>
    <rect class="card" x="575" y="100" width="350" height="180" rx="18"/>
    <path class="card-head" d="M 593 100 H 907 Q 925 100 925 118 V 155 H 575 V 118 Q 575 100 593 100 Z"/>
    <text class="table-name" x="598" y="132">groups</text>
    <text class="table-desc" x="598" y="149">Учебные группы</text>
    <rect class="key-pk" x="598" y="178" width="29" height="21" rx="6"/><text class="key" x="612.5" y="193" text-anchor="middle">PK</text>
    <text class="field" x="638" y="194">group_id · INTEGER IDENTITY</text>
    <text class="field" x="598" y="235">group_name · VARCHAR(50) UNIQUE</text>
  </g>

  <!-- schedule_snapshots -->
  <g>
    <rect class="card" x="100" y="430" width="520" height="250" rx="18"/>
    <path class="card-head" d="M 118 430 H 602 Q 620 430 620 448 V 485 H 100 V 448 Q 100 430 118 430 Z"/>
    <text class="table-name" x="124" y="462">schedule_snapshots</text>
    <text class="table-desc" x="124" y="479">Снимки расписания</text>
    <rect class="key-pk" x="124" y="506" width="29" height="21" rx="6"/><text class="key" x="138.5" y="521" text-anchor="middle">PK</text>
    <text class="field" x="164" y="522">snapshot_id · INTEGER IDENTITY</text>
    <rect class="key-fk" x="124" y="542" width="29" height="21" rx="6"/><text class="key" x="138.5" y="557" text-anchor="middle">FK</text>
    <text class="field" x="164" y="558">group_id · INTEGER</text>
    <text class="field" x="124" y="594">downloaded_at · TIMESTAMP</text>
    <text class="field" x="124" y="630">is_current · BOOLEAN</text>
  </g>

  <!-- sync_log -->
  <g>
    <rect class="card" x="880" y="430" width="520" height="310" rx="18"/>
    <path class="card-head" d="M 898 430 H 1382 Q 1400 430 1400 448 V 485 H 880 V 448 Q 880 430 898 430 Z"/>
    <text class="table-name" x="904" y="462">sync_log</text>
    <text class="table-desc" x="904" y="479">Журнал синхронизации</text>
    <rect class="key-pk" x="904" y="500" width="29" height="21" rx="6"/><text class="key" x="918.5" y="515" text-anchor="middle">PK</text>
    <text class="field" x="944" y="516">sync_id · INTEGER IDENTITY</text>
    <rect class="key-fk" x="904" y="532" width="29" height="21" rx="6"/><text class="key" x="918.5" y="547" text-anchor="middle">FK</text>
    <text class="field" x="944" y="548">group_id · INTEGER</text>
    <rect class="key-fk" x="904" y="564" width="29" height="21" rx="6"/><text class="key" x="918.5" y="579" text-anchor="middle">FK</text>
    <text class="field" x="944" y="580">snapshot_id · INTEGER NULL</text>
    <text class="field" x="904" y="612">sync_time · TIMESTAMP</text>
    <text class="field" x="904" y="644">status · VARCHAR(20)</text>
    <text class="field" x="904" y="676">details · TEXT</text>
  </g>

  <!-- lessons -->
  <g>
    <rect class="card" x="100" y="810" width="520" height="335" rx="18"/>
    <path class="card-head" d="M 118 810 H 602 Q 620 810 620 828 V 865 H 100 V 828 Q 100 810 118 810 Z"/>
    <text class="table-name" x="124" y="842">lessons</text>
    <text class="table-desc" x="124" y="859">Занятия в снимке расписания</text>
    <rect class="key-pk" x="124" y="883" width="29" height="21" rx="6"/><text class="key" x="138.5" y="898" text-anchor="middle">PK</text>
    <text class="field" x="164" y="899">lesson_id · INTEGER IDENTITY</text>
    <rect class="key-fk" x="124" y="915" width="29" height="21" rx="6"/><text class="key" x="138.5" y="930" text-anchor="middle">FK</text>
    <text class="field" x="164" y="931">snapshot_id · INTEGER</text>
    <text class="field" x="124" y="963">lesson_date · DATE</text>
    <text class="field" x="124" y="995">start_time · TIME</text>
    <text class="field" x="124" y="1027">end_time · TIME</text>
    <text class="field" x="124" y="1059">subject · VARCHAR(150)</text>
    <text class="field" x="124" y="1091">teacher · VARCHAR(100), NULL</text>
    <text class="field" x="124" y="1123">room · VARCHAR(30), NULL</text>
  </g>

  <!-- notes -->
  <g>
    <rect class="card" x="880" y="810" width="520" height="250" rx="18"/>
    <path class="card-head" d="M 898 810 H 1382 Q 1400 810 1400 828 V 865 H 880 V 828 Q 880 810 898 810 Z"/>
    <text class="table-name" x="904" y="842">notes</text>
    <text class="table-desc" x="904" y="859">Заметки к занятиям</text>
    <rect class="key-pk" x="904" y="883" width="29" height="21" rx="6"/><text class="key" x="918.5" y="898" text-anchor="middle">PK</text>
    <text class="field" x="944" y="899">note_id · INTEGER IDENTITY</text>
    <rect class="key-fk" x="904" y="915" width="29" height="21" rx="6"/><text class="key" x="918.5" y="930" text-anchor="middle">FK</text>
    <text class="field" x="944" y="931">lesson_id · INTEGER</text>
    <text class="field" x="904" y="963">note_text · TEXT</text>
    <text class="field" x="904" y="995">created_at · TIMESTAMP</text>
    <text class="field" x="904" y="1027">updated_at · TIMESTAMP</text>
  </g>

  <!-- Связи показаны после карточек, чтобы наконечники стрелок были видны у границ таблиц. -->
  <path class="line" d="M 660 280 L 360 430"/>
  <path class="line" d="M 840 280 L 1140 430"/>
  <path class="line-optional" d="M 620 550 L 880 550"/>
  <path class="line" d="M 360 680 L 360 810"/>
  <path class="line" d="M 620 975 L 880 975"/>

  <text class="count" x="632" y="306">1</text>
  <text class="count" x="375" y="422">N</text>
  <text class="count" x="857" y="306">1</text>
  <text class="count" x="1125" y="422">N</text>
  <rect x="665" y="522" width="170" height="28" rx="9" fill="#f4f7fc"/>
  <text class="relation" x="750" y="541" text-anchor="middle">snapshot_id · необязательный</text>
  <text class="count" x="371" y="702">1</text>
  <text class="count" x="371" y="803">N</text>
  <text class="count" x="632" y="966">1</text>
  <text class="count" x="857" y="966">N</text>

  <circle cx="110" cy="1183" r="7" fill="#3478d4"/>
  <text class="note" x="128" y="1189">PK — первичный ключ · FK — внешний ключ · для группы разрешён только один текущий снимок расписания</text>
</svg>
